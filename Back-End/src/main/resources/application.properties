# Server Port
server.port=8080

# ===============================================
# Database Configuration (PostgreSQL in Prod / H2 fallback in Dev)
# ===============================================
spring.datasource.url=${DB_URL:jdbc:h2:mem:rankquest;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# ===============================================
# Connection Pool Tuning (HikariCP)
# ===============================================
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=3
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.connection-timeout=20000

# ===============================================
# JPA / Hibernate Configuration
# ===============================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Enable H2 Console in dev
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ===============================================
# JWT Configuration
# ===============================================
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}